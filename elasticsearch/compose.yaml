name: survos-es
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: survos-es
    restart: unless-stopped
    mem_limit: 2g
    environment:
      cluster.name: survos-testing
      node.name: fsn1-es
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/server.key
      xpack.security.http.ssl.certificate: certs/server.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/server.key
      xpack.security.transport.ssl.certificate: certs/server.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca.crt
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic-password
      ingest.geoip.downloader.enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - ./heap.options:/usr/share/elasticsearch/config/jvm.options.d/heap.options:ro
      - ./secrets/elastic-password:/run/secrets/elastic-password:ro
      - ./secrets/health.netrc:/run/secrets/health.netrc:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert config/certs/ca.crt --netrc-file /run/secrets/health.netrc 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - search
networks:
  search:
    name: survos-es-private
volumes:
  es-data:
    name: survos-es-data
