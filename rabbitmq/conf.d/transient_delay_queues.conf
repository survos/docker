# jwage/phpamqplib-messenger declares Messenger's delay/retry queues transiently.
#
# Connection::setupDelayQueue() calls queue_declare() with only queue/nowait/arguments, so
# php-amqplib's defaults apply: durable=false, exclusive=false. RabbitMQ 4.3 flipped
# `transient_nonexcl_queues` from permitted_by_default to denied_by_default, so that declaration
# now fails with INTERNAL_ERROR -- and it fails inside SendFailedMessageForRetryListener, which
# means the worker EXITS instead of retrying. One transient error (a source 5xx, an imgproxy
# timeout) therefore kills a worker permanently. Measured 2026-08-20: a single dead fortepan URL
# took down mediary's asset.archive worker and stopped a 500-image run.
#
# Not in the happy path -- no failure, no delayed publish, no delay queue -- but guaranteed to
# matter on any run long enough to hit a blip, which is every large collection.
#
# This restores the pre-4.3 default rather than introducing anything new, so it cannot break what
# already works. The delay queues carry x-expires and clean themselves up either way.
#
# TEMPORARY. The real fix is upstream and already written twice:
#   https://github.com/jwage/phpamqplib-messenger/pull/124  (adds a queue_durable option)
#   https://github.com/jwage/phpamqplib-messenger/pull/115  (makes them durable outright)
# Neither is merged as of 0.10.1. When one lands, set the transport's delay.queue_durable=true
# and DELETE this file -- leaving it means a future RabbitMQ that removes the feature outright
# breaks us with no warning.
deprecated_features.permit.transient_nonexcl_queues = true
