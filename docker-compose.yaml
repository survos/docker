services:
    # Local SearchBundle testing on the Mac (Podman VM: 8 GiB).
    # Start explicitly; keep the unauthenticated endpoint on loopback only.
    elasticsearch:
        profiles: ["ondemand"]
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
        container_name: survos_elasticsearch
        restart: "no"
        mem_limit: 2g
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
            interval: 30s
            start_period: 60s
            timeout: 10s
            retries: 5

    satis:
        profiles: ["ondemand"]
        build:
            context: ./satis
            target: server
        restart: "no"
        ports:
            - "127.0.0.1:8743:8080"
        volumes:
            - ./satis/var:/srv:ro
    satis-publisher:
        profiles: ["tools"]
        build:
            context: ./satis
            target: publisher
        volumes:
            - ../mono:/mono:ro
            - ./satis/var:/data

    postgres:
        # Pinned deliberately -- `pg18-all` is a FLOATING tag. On 2026-08-16 the
        # local image had timescaledb 2.27.1 while that tag had moved to 2.29.1,
        # so dev drifted from a fresh pull with no signal. Upgrades should be a
        # committed change to this line, matching ~/sites/postgres/Dockerfile
        # (which production deploys from). See survos/docker#5.
        image: timescale/timescaledb-ha:pg18.4-ts2.29.1-all
        container_name: survos_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: docker
        ports:
            - "5434:5432"
        volumes:
            - postgres_data:/home/postgres/pgdata
        healthcheck:
            # `interval` is the STEADY-STATE cadence, `start_interval` the one used
            # only while the container is inside `start_period`. Splitting them is the
            # whole trick: dependents gated on `service_healthy` still come up in a
            # couple of seconds, but a stack left running all day stops paying for a
            # probe every 5s forever. Every healthcheck here is a `docker exec`, which
            # forks runc + containerd-shim on the host -- the cost is never just the
            # command being run.
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            start_interval: 2s
            start_period: 30s
            timeout: 3s
            retries: 5

    # One MariaDB for every local WordPress site: survos, ff, kpa, pgsc (and Omeka S,
    # which wants MySQL too). Per-site databases and users, not per-site servers.
    #
    # Deliberately here rather than inside any site's directory. `symfony server:start`
    # detects the Docker Compose services of the project it runs from and injects their
    # connection details as DB_HOST, DB_PORT, ... which, because Bedrock's dotenv
    # repository is immutable, override the site's .env. With the database out of the
    # site directories there is nothing to detect, so each .env is used verbatim.
    #
    # Create a database and its user with bin/create-db.sh <name>.
    mariadb:
        image: mariadb:11.4
        container_name: survos_mariadb
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-docker}"
        command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            # retries: 30 at 5s was really a 150s boot allowance in disguise; that is
            # what start_period is for, so the retry count can go back to meaning
            # "how many consecutive failures before we call it sick".
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 30s
            start_interval: 2s
            start_period: 90s
            timeout: 5s
            retries: 5

    postgres_messenger:
        image: postgres:18-alpine
        container_name: survos_messenger
        restart: unless-stopped
        environment:
            POSTGRES_USER: messenger
            POSTGRES_PASSWORD: messenger
            POSTGRES_DB: messenger
        ports:
            - "5435:5432"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/messenger:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U messenger"]
            interval: 30s
            start_interval: 2s
            start_period: 30s
            timeout: 3s
            retries: 5

    # imgproxy:
    #     image: docker.imgproxy.pro/imgproxy:v4.0.11-ml
    #     container_name: imgproxy
    #     environment:
    ##         in dev, leave unset, 100 req/minute         
    #         IMGPROXY_LICENSE_KEY: ${IMGPROXY_LICENSE_KEY:?Set IMGPROXY_LICENSE_KEY in your environment}
    #     ports:
    #         - "8080:8080"

    redis:
        image: redis:latest
        container_name: survos_redis
        restart: unless-stopped
        command: ["redis-server", "--save", "60", "100"]
        ports:
            - "6379:6379"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_conf:/usr/local/etc/redis
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_data:/data

    mercure:
        image: dunglas/mercure
        container_name: survos_mercure
        restart: unless-stopped
        ports:
            - "3000:80"
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_SUBSCRIBER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins *
                anonymous
        healthcheck:
            # SERVER_NAME is ':80' above (plain HTTP, no cert) -- this
            # tested https://localhost/healthz on :443, which is never
            # listening, so it always failed regardless of the service's
            # actual health. Confirmed live: Mercure was serving real
            # subscribers/publishes the whole time this said "unhealthy".
            test: ["CMD", "curl", "-f", "http://localhost/healthz"]
            interval: 30s
            start_interval: 2s
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_data:/data/caddy
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_config:/config

    mailer:
        image: axllent/mailpit
        container_name: survos_mailer
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    rabbitmq:
        image: rabbitmq:4-management
        container_name: survos_rabbitmq
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            RABBITMQ_DEFAULT_VHOST: packages
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/rabbitmq:/var/lib/rabbitmq
            - ./rabbitmq/conf.d:/etc/rabbitmq/conf.d:ro
        healthcheck:
            # `rabbitmq-diagnostics ping` boots a COMPLETE Erlang VM per probe to ask
            # the broker whether it is alive -- measured at ~385% CPU sustained on this
            # box, every 10s, forever. Opening a TCP connection to the AMQP port answers
            # the same question (is the broker accepting connections) for free.
            #
            # `bash` is load-bearing: /bin/sh in this image is dash, which has no
            # /dev/tcp, so the CMD-SHELL form of this silently fails-closed and the
            # container never becomes healthy.
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5672"]
            interval: 30s
            start_interval: 2s
            start_period: 60s
            timeout: 5s
            retries: 5

    # Grist -- spreadsheet/database hybrid, under evaluation as a home for small
    # shared datasets (see README). Two images exist: gristlabs/grist-oss is the
    # pure Apache-2.0 build, gristlabs/grist is the same core plus the optional
    # enterprise toggle (unactivated = Community Edition). We run -oss so what's
    # here is exactly what's redistributable.
    #
    # /persist holds everything: the .grist documents, the sessions DB, and the
    # home metadata DB. It's a NAMED volume on purpose -- the $DOCKER_DATA_ROOT
    # dirs are root-owned and Grist runs as uid 1000, so a bind mount there
    # fails on first write.
    grist:
        # ON DEMAND -- not started by `docker compose up -d`. Grist runs remotely at
        # https://grist.survos.com and that is what apps should point at. Start this
        # one only to develop against a newer version or reproduce a bug:
        #
        #     docker compose up -d grist
        #
        # Naming a profiled service explicitly enables its profile, so no --profile
        # flag is needed. See DEV-SERVICES.md for the full local -> deploy -> repoint
        # workflow.
        profiles: ["ondemand"]
        image: gristlabs/grist-oss:latest
        container_name: survos_grist
        restart: unless-stopped
        environment:
            # Dev-only secrets, same posture as the Mercure JWT keys above.
            GRIST_SESSION_SECRET: 'a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00'
            # Gates first-run setup and the /admin panel. Pinned so a fresh
            # clone doesn't have to go digging in the logs for a random key.
            GRIST_BOOT_KEY: 'survos-dev-boot-key'
            # No auth provider is configured, so Grist runs single-user: every
            # request is this account, which is also the install admin.
            GRIST_DEFAULT_EMAIL: tacman@gmail.com
            GRIST_SINGLE_ORG: survos
            APP_HOME_URL: http://localhost:8484
            # Grist runs formulas in a sandbox; gvisor is the image default and
            # needs privileges Docker doesn't grant here. pyodide is the
            # WASM-based flavor that needs nothing from the host.
            # The admin panel reports gVisor as "Ready" inside this image, and
            # it's both the Grist default and the faster option, so use it.
            GRIST_SANDBOX_FLAVOR: gvisor
            # Grist 2.x gates the API behind a first-run setup wizard until the
            # install is marked in-service. Setting it here means a fresh clone
            # comes up ready instead of needing someone to click through /boot.
            GRIST_IN_SERVICE: 'true'
        ports:
            - "127.0.0.1:8484:8484"
        volumes:
            - grist_data:/persist
        healthcheck:
            # Was `node -e "..."`, which booted a whole Node runtime every 10s to make
            # one HTTP request. The image ships curl -- a small C binary that checks the
            # same URL for the same 200 at a tiny fraction of the cost. Same semantics,
            # not a downgrade to a bare port check.
            test: ["CMD", "curl", "-fsS", "http://localhost:8484/status"]
            interval: 30s
            start_interval: 2s
            start_period: 60s
            timeout: 5s
            retries: 5

volumes:
    elasticsearch_data:
    postgres_data:
    grist_data:
    mariadb_data:
