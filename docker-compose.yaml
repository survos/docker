services:
    postgres:
        image: timescale/timescaledb-ha:pg18-all
        container_name: survos_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: docker
        ports:
            - "5434:5432"
        volumes:
            - postgres_data:/home/postgres/pgdata
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 10

    postgres_messenger:
        image: postgres:18-alpine
        container_name: survos_messenger
        environment:
            POSTGRES_USER: messenger
            POSTGRES_PASSWORD: messenger
            POSTGRES_DB: messenger
        ports:
            - "5435:5432"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/messenger:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U messenger"]
            interval: 5s
            timeout: 3s
            retries: 10

    # imgproxy:
    #     image: docker.imgproxy.pro/imgproxy:v4.0.11-ml
    #     container_name: imgproxy
    #     environment:
    ##         in dev, leave unset, 100 req/minute         
    #         IMGPROXY_LICENSE_KEY: ${IMGPROXY_LICENSE_KEY:?Set IMGPROXY_LICENSE_KEY in your environment}
    #     ports:
    #         - "8080:8080"

    redis:
        image: redis:latest
        container_name: survos_redis
        command: ["redis-server", "--save", "60", "100"]
        ports:
            - "6379:6379"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_conf:/usr/local/etc/redis
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_data:/data

    mercure:
        image: dunglas/mercure
        container_name: survos_mercure
        restart: unless-stopped
        ports:
            - "3000:80"
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_SUBSCRIBER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins *
                anonymous
        healthcheck:
            test: ["CMD", "curl", "-f", "https://localhost/healthz"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_data:/data/caddy
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_config:/config

    mailer:
        image: axllent/mailpit
        container_name: survos_mailer
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    rabbitmq:
        image: rabbitmq:4-management
        container_name: survos_rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            RABBITMQ_DEFAULT_VHOST: packages
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/rabbitmq:/var/lib/rabbitmq
            - ./rabbitmq/conf.d:/etc/rabbitmq/conf.d:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
