services:
    # Shared Elasticsearch development node used by SearchBundle-backed apps.
    # Application-specific indexes and mappings remain owned by SearchBundle.
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
        container_name: survos_elasticsearch
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 60s

    kibana:
        image: docker.elastic.co/kibana/kibana:9.5.0
        container_name: survos_kibana
        restart: unless-stopped
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        ports:
            - "127.0.0.1:5601:5601"

    postgres:
        image: timescale/timescaledb-ha:pg18-all
        container_name: survos_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: docker
        ports:
            - "5434:5432"
        volumes:
            - postgres_data:/home/postgres/pgdata
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 10

    postgres_messenger:
        image: postgres:18-alpine
        container_name: survos_messenger
        restart: unless-stopped
        environment:
            POSTGRES_USER: messenger
            POSTGRES_PASSWORD: messenger
            POSTGRES_DB: messenger
        ports:
            - "5435:5432"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/messenger:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U messenger"]
            interval: 5s
            timeout: 3s
            retries: 10

    # imgproxy:
    #     image: docker.imgproxy.pro/imgproxy:v4.0.11-ml
    #     container_name: imgproxy
    #     environment:
    ##         in dev, leave unset, 100 req/minute         
    #         IMGPROXY_LICENSE_KEY: ${IMGPROXY_LICENSE_KEY:?Set IMGPROXY_LICENSE_KEY in your environment}
    #     ports:
    #         - "8080:8080"

    redis:
        image: redis:latest
        container_name: survos_redis
        restart: unless-stopped
        command: ["redis-server", "--save", "60", "100"]
        ports:
            - "6379:6379"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_conf:/usr/local/etc/redis
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/redis_data:/data

    mercure:
        image: dunglas/mercure
        container_name: survos_mercure
        restart: unless-stopped
        ports:
            - "3000:80"
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_SUBSCRIBER_JWT_KEY: 'c4e7f8a2c3f1e6b0d9c2b4a7e8f1c0d9a6b3f2e4c8d7a1b0e9f6a5c4d3b2a1'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins *
                anonymous
        healthcheck:
            # SERVER_NAME is ':80' above (plain HTTP, no cert) -- this
            # tested https://localhost/healthz on :443, which is never
            # listening, so it always failed regardless of the service's
            # actual health. Confirmed live: Mercure was serving real
            # subscribers/publishes the whole time this said "unhealthy".
            test: ["CMD", "curl", "-f", "http://localhost/healthz"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_data:/data/caddy
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/mercure_config:/config

    mailer:
        image: axllent/mailpit
        container_name: survos_mailer
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    rabbitmq:
        image: rabbitmq:4-management
        container_name: survos_rabbitmq
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            RABBITMQ_DEFAULT_VHOST: packages
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - ${DOCKER_DATA_ROOT:?Set DOCKER_DATA_ROOT}/rabbitmq:/var/lib/rabbitmq
            - ./rabbitmq/conf.d:/etc/rabbitmq/conf.d:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    elasticsearch_data:
    postgres_data:
